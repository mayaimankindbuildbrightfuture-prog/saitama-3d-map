# さいたま市・仙台市・東京23区の最新ニュースとライブカメラの配信状況を定期的に調べて data/ を更新し、GitHub Pages に公開する。
# APIキーやシークレットは不要（リポジトリ標準の GITHUB_TOKEN だけを使う）。
name: ニュース更新と公開

on:
  schedule:
    - cron: "17 */3 * * *" # 3時間ごと（UTC。毎時17分）
  workflow_dispatch: # Actions タブから手動実行
  push:
    branches: [main]

permissions:
  contents: write # data/news.json のコミット
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: テスト
        run: python3 -m unittest discover -s tests

      - name: ニュースを取得
        run: python3 scripts/fetch_news.py

      - name: ライブカメラの配信を確認
        run: python3 scripts/fetch_livecams.py

      - name: 仙台市版のニュースを取得
        run: python3 scripts/fetch_news.py --city sendai

      - name: 仙台市版のライブカメラの配信を確認
        run: python3 scripts/fetch_livecams.py --city sendai

      - name: 仙台市版のクマ目撃等情報（宮城県）を取得
        run: python3 scripts/fetch_bears.py

      - name: 東京23区版のニュースを取得
        run: python3 scripts/fetch_news.py --city tokyo

      - name: 東京23区版のライブカメラの配信を確認
        run: python3 scripts/fetch_livecams.py --city tokyo

      - name: 変更があればコミット
        run: |
          if git diff --quiet -- data/news.json data/livecams.json sendai/data/news.json sendai/data/livecams.json sendai/data/bears.json sendai/data/bear_places.json tokyo/data/news.json tokyo/data/livecams.json; then
            echo "ニュース・ライブカメラに変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/livecams.json sendai/data/news.json sendai/data/livecams.json sendai/data/bears.json sendai/data/bear_places.json tokyo/data/news.json tokyo/data/livecams.json
          git commit -m "ニュースを更新"
          git push

      - name: Pages の設定
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true # Pages を使わない場合でもニュースの更新は続ける

      - name: 公開用ファイルをまとめる
        if: steps.pages.outcome == 'success'
        run: |
          mkdir -p _site/sendai
          cp -r index.html city.js app.js style.css data _site/
          cp -r sendai/index.html sendai/city.js sendai/data _site/sendai/
          mkdir -p _site/tokyo
          cp -r tokyo/index.html tokyo/city.js tokyo/data _site/tokyo/

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: _site

      - name: GitHub Pages へ公開
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
